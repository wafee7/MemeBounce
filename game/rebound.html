const KEY = {};
const KEY_JUST = {};
window.addEventListener('keydown', e => {
  if (!KEY[e.code]) KEY_JUST[e.code] = true;
  KEY[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { KEY[e.code] = false; });

function clearJust() { for (const k in KEY_JUST) delete KEY_JUST[k]; }
function pressed(code) { return KEY_JUST[code] || false; }
function held(code) { return KEY[code] || false; }

// ══════════════════════════════════════════════════════
//  MAP PARSING
// ══════════════════════════════════════════════════════
function parseLevel(lvl) {
  const map = lvl.map;
  levelH = map.length;
  levelW = Math.max(...map.map(r => r.length));

  tiles    = [];
  flyers   = [];
  doors    = [];
  plates   = [];
  bouncePads = [];
  spikes   = [];
  exitPortal = null;
  player   = null;

  for (let row = 0; row < map.length; row++) {
    const line = map[row];
    // Parse multi-char tokens (aa, bb, oo) then single chars
    let col = 0;
    while (col < line.length) {
      const ch2 = line.substring(col, col+2);
      const ch  = line[col];

      if (ch2 === 'aa') {
        // flyer spawn marker — just mark tile as empty
        tiles.push({col, row, type:'empty'});
        tiles.push({col:col+1, row, type:'empty'});
        // The wave system handles spawning
        col += 2; continue;
      }
      if (ch2 === 'bb') {
        tiles.push({col, row, type:'empty'});
        tiles.push({col:col+1, row, type:'empty'});
        col += 2; continue;
      }
      if (ch2 === 'oo') {
        bouncePads.push({col, row});
        bouncePads.push({col:col+1, row});
        tiles.push({col, row, type:'bounce'});
        tiles.push({col:col+1, row, type:'bounce'});
        col += 2; continue;
      }

      let type = 'empty';
      if (ch === '#') type = 'wall';
      else if (ch === '-') type = 'platform';
      else if (ch === '^') type = 'spike';
      else if (ch === 'o') { type = 'bounce'; bouncePads.push({col, row}); }
      else if (ch === 'a') {
        type = 'empty';
        doors.push({col, row, channel:'A', open:false});
      }
      else if (ch === 'b') {
        type = 'empty';
        doors.push({col, row, channel:'B', open:false});
      }
      else if (ch === 'A') {
        type = 'empty';
        plates.push({col, row, channel:'A', pressed:false});
      }
      else if (ch === 'B') {
        type = 'empty';
        plates.push({col, row, channel:'B', pressed:false});
      }
      else if (ch === 'E') {
        type = 'empty';
        exitPortal = {col, row};
      }
      else if (ch === 'P') {
        type = 'empty';
        player = makePlayer(col * TILE + TILE/2, row * TILE + TILE - 1);
      }

      tiles.push({col, row, type});
      col++;
    }
  }

  // Build grid lookup for fast collision
  buildGrid();
}

let grid = {}; // "col,row" -> tile type
function buildGrid() {
  grid = {};
  for (const t of tiles) {
    grid[t.col + ',' + t.row] = t.type;
  }
}

function tileAt(col, row) {
  return grid[col + ',' + row] || 'empty';
}

// ══════════════════════════════════════════════════════
//  PLAYER
// ══════════════════════════════════════════════════════
function makePlayer(px, py) {
  return {
    px, py,
    vx:0, vy:0,
    onGround:false,
    coyote:0,
    jumpBuffer:0,
    alive:true,
    anim:'idle', // idle|run|jump|fall|dead
    facing:1,
    // half-extents from HITBOX Rect2(-3,-11,6,10): w=6,h=10
    hw:3, hh:5,  // half-width, half-height
    spawnX:0, spawnY:0,
    tick:0
  };
}

function respawnPlayer() {
  const lvl = LEVELS[levelIdx];
  const map = lvl.map;
  for (let row = 0; row < map.length; row++) {
    const line = map[row];
    for (let col = 0; col < line.length; col++) {
      if (line[col] === 'P') {
        player.px = col * TILE + TILE/2;
        player.py = row * TILE + TILE - 1;
      }
    }
  }
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.coyote = 0;
  player.jumpBuffer = 0; player.alive = true;
  player.anim = 'idle'; player.tick = 0;
  flyers = [];
  initWaves();
  waveTimers = [];
  const wvs = LEVELS[levelIdx].waves;
  for (const w of wvs) waveTimers.push({...w, timer: w.first});
}

// ══════════════════════════════════════════════════════
//  FLYERS
// ══════════════════════════════════════════════════════
let waveTimers = [];

function initWaves() {
  waveTimers = [];
  const wvs = LEVELS[levelIdx].waves;
  for (const w of wvs) {
    waveTimers.push({y:w.y, interval:w.interval, speed:w.speed, bob:w.bob, timer:w.first});
  }
}

function makeFlyer(wy, speed) {
  const startX = levelW * TILE + 8;
  const startY = wy * TILE;
  return {px:startX, py:startY, speed, hw:4, hh:4, bobPhase:0, alive:true};
}

function updateWaves(dt) {
  for (const wt of waveTimers) {
    wt.timer -= 60 * dt; // convert to ticks
    if (wt.timer <= 0) {
      wt.timer = wt.interval;
      flyers.push(makeFlyer(wt.y, wt.speed));
    }
  }
}

function updateFlyers(dt) {
  for (const f of flyers) {
    if (!f.alive) continue;
    f.px -= f.speed * dt;
    f.bobPhase += 2 * dt;
    f.py += Math.sin(f.bobPhase) * 0.3;

    // Off screen left
    if (f.px < -20) { f.alive = false; continue; }

    // Check stomp by player (player falling on top)
    if (player.alive) {
      const pdx = Math.abs(player.px - f.px);
      const topDiff = (f.py - f.hh) - (player.py + player.hh);
      if (pdx < f.hw + player.hw - 1 && topDiff > -4 && topDiff < 4 && player.vy > 0) {
        f.alive = false;
        player.vy = BOUNCE_VEL * 0.5;
        continue;
      }
      // Side collision
      if (pdx < f.hw + player.hw - 2 && Math.abs(player.py - f.py) < f.hh + player.hh - 2) {
        killPlayer();
        continue;
      }
    }

    // Check stomp by echo
    if (echo && echo.active) {
      const edx = Math.abs(echo.px - f.px);
      const eTop = (f.py - f.hh) - (echo.py + 5);
      if (edx < f.hw + 3 - 1 && eTop > -4 && eTop < 4 && echo.vy > 0) {
        f.alive = false;
      }
    }
  }
  flyers = flyers.filter(f => f.alive);
}

// ══════════════════════════════════════════════════════
//  ECHO SYSTEM
// ══════════════════════════════════════════════════════
function startRecording() {
  recFrames = [];
}

function recordFrame() {
  if (!player.alive) return;
  recFrames.push({
    px: player.px, py: player.py,
    vx: player.vx, vy: player.vy,
    anim: player.anim, facing: player.facing
  });
}

function saveEcho() {
  if (recFrames.length >= ECHO_MIN_TICKS) {
    echo = {
      frames: recFrames.slice(),
      frame: 0,
      active: false,
      px:0, py:0, vx:0, vy:0,
      anim:'idle', facing:1,
      done:false
    };
  }
}

function startEcho() {
  if (!echo) return;
  echo.frame = 0;
  echo.active = true;
  echo.done = false;
  if (echo.frames.length > 0) {
    const f = echo.frames[0];
    echo.px = f.px; echo.py = f.py;
    echo.vx = f.vx; echo.vy = f.vy;
    echo.anim = f.anim; echo.facing = f.facing;
  }
}

function updateEcho(dt) {
  if (!echo || !echo.active || echo.done) return;
  echo.frame++;
  if (echo.frame >= echo.frames.length) {
    echo.done = true; echo.active = false; return;
  }
  const f = echo.frames[echo.frame];
  echo.px = f.px; echo.py = f.py;
  echo.vx = f.vx; echo.vy = f.vy;
  echo.anim = f.anim; echo.facing = f.facing;

  // Echo presses plates
  checkEchoPlates();
}

function checkEchoPlates() {
  if (!echo || !echo.active) return;
  for (const p of plates) {
    const pcx = p.col * TILE + TILE/2;
    const pcy = p.row * TILE + TILE/2;
    const dx  = Math.abs(echo.px - pcx);
    const dy  = Math.abs(echo.py - pcy);
    if (dx < TILE && dy < TILE) {
      p.pressed = true;
    }
  }
}

// ══════════════════════════════════════════════════════
//  COLLISION
// ══════════════════════════════════════════════════════
function solidAt(col, row) {
  const t = tileAt(col, row);
  if (t === 'wall') return true;
  // Check doors
  for (const d of doors) {
    if (d.col === col && d.row === row && !d.open) return true;
  }
  return false;
}

function platformAt(col, row) {
  return tileAt(col, row) === 'platform';
}

function moveEntity(ent, dt) {
  // Gravity
  if (ent.vy < 0) ent.vy += GRAVITY_UP  * dt;
  else             ent.vy += GRAVITY_DOWN * dt;
  if (ent.vy > MAX_FALL) ent.vy = MAX_FALL;

  // Move X
  ent.px += ent.vx * dt;
  resolveX(ent);

  // Move Y
  ent.py += ent.vy * dt;
  const wasOnGround = ent.onGround;
  ent.onGround = false;
  resolveY(ent);

  return wasOnGround;
}

function resolveX(ent) {
  const hw = ent.hw || 3;
  const hh = ent.hh || 5;
  const left   = Math.floor((ent.px - hw) / TILE);
  const right  = Math.floor((ent.px + hw - 0.01) / TILE);
  const top    = Math.floor((ent.py - hh*2) / TILE);
  const bottom = Math.floor((ent.py - 1) / TILE);

  for (let row = top; row <= bottom; row++) {
    if (solidAt(left, row)) {
      ent.px = left * TILE + TILE + hw;
      ent.vx = 0;
    }
    if (solidAt(right, row)) {
      ent.px = right * TILE - hw;
      ent.vx = 0;
    }
  }
}

function resolveY(ent) {
  const hw = ent.hw || 3;
  const hh = ent.hh || 5;

  const bottom = Math.floor((ent.py - 0.1) / TILE);
  const top    = Math.floor((ent.py - hh*2 - 0.1) / TILE);
  const colL   = Math.floor((ent.px - hw + 1) / TILE);
  const colR   = Math.floor((ent.px + hw - 2) / TILE);

  // Floor collision
  if (ent.vy >= 0) {
    // Solid tiles
    for (let col = colL; col <= colR; col++) {
      if (solidAt(col, bottom)) {
        ent.py = bottom * TILE;
        ent.vy = 0;
        ent.onGround = true;
        break;
      }
    }
    // Platform tiles (one-way)
    if (!ent.onGround) {
      for (let col = colL; col <= colR; col++) {
        if (platformAt(col, bottom)) {
          const prevBottom = Math.floor((ent.py - 0.1 - ent.vy * (1/60)) / TILE);
          if (prevBottom < bottom) {
            ent.py = bottom * TILE;
            ent.vy = 0;
            ent.onGround = true;
            break;
          }
        }
      }
    }
    // Bounce pads
    if (ent.onGround) {
      for (let col = colL; col <= colR; col++) {
        if (tileAt(col, bottom) === 'bounce') {
          ent.vy = BOUNCE_VEL;
          ent.onGround = false;
          break;
        }
      }
    }
  }

  // Ceiling collision
  if (ent.vy < 0) {
    for (let col = colL; col <= colR; col++) {
      if (solidAt(col, top)) {
        ent.py = (top + 1) * TILE + hh*2;
        ent.vy = 0;
        break;
      }
    }
  }
}

// ══════════════════════════════════════════════════════
//  PLAYER UPDATE
// ══════════════════════════════════════════════════════
function updatePlayer(dt) {
  if (!player.alive) return;

  const left  = held('KeyA') || held('ArrowLeft');
  const right = held('KeyD') || held('ArrowRight');
  const jump  = held('Space') || held('ArrowUp') || held('KeyW');
  const jumpP = pressed('Space') || pressed('ArrowUp') || pressed('KeyW');

  // Horizontal
  const targetVx = right ? RUN_SPEED : left ? -RUN_SPEED : 0;
  const isGround = player.onGround;
  const acc = isGround
    ? (targetVx !== 0 ? ACCEL : DECEL)
    : (targetVx !== 0 ? AIR_ACCEL : AIR_DECEL);
  
  if (Math.abs(targetVx - player.vx) < acc * dt) player.vx = targetVx;
  else player.vx += Math.sign(targetVx - player.vx) * acc * dt;

  if (right) player.facing = 1;
  if (left)  player.facing = -1;

  // Coyote time
  if (player.onGround) player.coyote = COYOTE_TICKS;
  else if (player.coyote > 0) player.coyote--;

  // Jump buffer
  if (jumpP) player.jumpBuffer = BUFFER_TICKS;
  else if (player.jumpBuffer > 0) player.jumpBuffer--;

  // Jump
  if (player.jumpBuffer > 0 && player.coyote > 0) {
    player.vy = JUMP_VEL;
    player.coyote = 0;
    player.jumpBuffer = 0;
  }

  // Jump cut
  if (!jump && player.vy < JUMP_VEL * JUMP_CUT) {
    player.vy = JUMP_VEL * JUMP_CUT;
  }

  moveEntity(player, dt);

  // Spike check
  checkSpikes();

  // Plate check
  checkPlates();

  // Exit check
  checkExit();

  // Animation
  if (!player.onGround) {
    player.anim = player.vy < 0 ? 'jump' : 'fall';
  } else if (Math.abs(player.vx) > 5) {
    player.anim = 'run';
  } else {
    player.anim = 'idle';
  }

  // Record
  recordFrame();
}

function checkSpikes() {
  const col = Math.floor(player.px / TILE);
  const row = Math.floor((player.py) / TILE);
  for (let dc = -1; dc <= 1; dc++) {
    for (let dr = -1; dr <= 1; dr++) {
      if (tileAt(col+dc, row+dr) === 'spike') {
        // Simple point-in-tile check
        const sx = (col+dc)*TILE, sy = (row+dr)*TILE;
        if (player.px > sx+1 && player.px < sx+TILE-1 &&
            player.py > sy+2 && player.py < sy+TILE) {
          killPlayer();
          return;
        }
      }
    }
  }
}

function checkPlates() {
  // Reset plates pressed by player this frame
  for (const p of plates) {
    if (!p._echoPressing) p.pressed = false;
  }
  for (const p of plates) {
    p._echoPressing = false;
    const pcx = p.col * TILE + TILE/2;
    const pcy = p.row * TILE + TILE/2;
    const dx  = Math.abs(player.px - pcx);
    const dy  = Math.abs(player.py - pcy);
    if (dx < TILE && dy < TILE) p.pressed = true;
  }
  // Update doors
  for (const d of doors) {
    const platOn = plates.some(p => p.channel === d.channel && p.pressed);
    d.open = platOn;
  }
}

function checkExit() {
  if (!exitPortal) return;
  const ex = exitPortal.col * TILE + TILE/2;
  const ey = exitPortal.row * TILE + TILE/2;
  if (Math.abs(player.px - ex) < TILE && Math.abs(player.py - ey) < TILE) {
    nextLevel();
  }
}

function killPlayer(manual) {
  if (!player.alive) return;
  player.alive = false;
  saveEcho();
  deathFlash = 1.0;
  glitchTimer = 0.4;
  failMsg = FAIL_MSGS[Math.floor(Math.random() * FAIL_MSGS.length)];
  failAlpha = 1.5;
  attempts++;
  totalAttempts++;

  setTimeout(() => {
    respawnPlayer();
    startRecording();
    startEcho();
    // Reset plate _echoPressing flags
    for (const p of plates) p._echoPressing = false;
  }, manual ? 200 : 500);
}

function rebound() {
  if (!player.alive) return;
  killPlayer(true);
}

// ══════════════════════════════════════════════════════
//  LEVEL MANAGEMENT
// ══════════════════════════════════════════════════════
function loadLevel(idx) {
  levelIdx = idx;
  attempts = 0;
  echo     = null;
  recFrames = [];
  parseLevel(LEVELS[idx]);
  initWaves();
  startRecording();
  glitchTimer = 0.3;
  deathFlash  = 0;
  failAlpha   = 0;
}

function nextLevel() {
  if (levelIdx >= LEVELS.length - 1) {
    STATE = 'end';
  } else {
    loadLevel(levelIdx + 1);
  }
}

// ══════════════════════════════════════════════════════
//  CAMERA
// ══════════════════════════════════════════════════════
function updateCamera() {
  const targetX = player.px - CANVAS_W / 2;
  const targetY = player.py - CANVAS_H / 2;
  const maxX = levelW * TILE - CANVAS_W;
  const maxY = levelH * TILE - CANVAS_H;
  const clampX = Math.max(0, Math.min(maxX, targetX));
  const clampY = Math.max(0, Math.min(maxY, targetY));
  camX += (clampX - camX) * 0.12;
  camY += (clampY - camY) * 0.12;
}

// ══════════════════════════════════════════════════════
//  DRAWING
// ══════════════════════════════════════════════════════
function drawGame() {
  // Background
  ctx.fillStyle = COL_BG;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.save();
  ctx.translate(-Math.round(camX), -Math.round(camY));

  drawTiles();
  drawDoors();
  drawPlates();
  drawExit();
  drawEcho();
  drawPlayer();
  drawFlyers();

  ctx.restore();

  drawScreenFX();
  drawHUD();
  drawHints();
  drawFailMsg();
}

function drawTiles() {
  const startCol = Math.floor(camX / TILE);
  const endCol   = Math.ceil((camX + CANVAS_W) / TILE);
  const startRow = Math.floor(camY / TILE);
  const endRow   = Math.ceil((camY + CANVAS_H) / TILE);

  for (let row = startRow; row <= endRow; row++) {
    for (let col = startCol; col <= endCol; col++) {
      const t = tileAt(col, row);
      const x = col * TILE, y = row * TILE;
      if (t === 'wall') {
        ctx.fillStyle = COL_WALL;
        ctx.fillRect(x, y, TILE, TILE);
        // Subtle highlight edge
        ctx.fillStyle = COL_WALL2;
        ctx.fillRect(x, y, TILE, 1);
        ctx.fillRect(x, y, 1, TILE);
      } else if (t === 'platform') {
        ctx.fillStyle = COL_PLATFORM;
        ctx.fillRect(x, y, TILE, 2);
      } else if (t === 'spike') {
        ctx.fillStyle = COL_SPIKE;
        ctx.beginPath();
        ctx.moveTo(x+1, y+TILE);
        ctx.lineTo(x+TILE/2, y+2);
        ctx.lineTo(x+TILE-1, y+TILE);
        ctx.closePath();
        ctx.fill();
      } else if (t === 'bounce') {
        ctx.fillStyle = COL_BOUNCE;
        ctx.fillRect(x, y+TILE-3, TILE, 3);
        // Animated spring lines
        const ph = (frameCount * 0.05) % 1;
        ctx.fillStyle = '#fde68a';
        ctx.fillRect(x+1, y+TILE-5+Math.round(Math.sin(ph*Math.PI*2)*1), TILE-2, 1);
      }
    }
  }
}

function drawDoors() {
  for (const d of doors) {
    if (d.open) continue;
    const x = d.col * TILE, y = d.row * TILE;
    ctx.fillStyle = d.channel === 'A' ? COL_DOOR_A : COL_DOOR_B;
    ctx.fillRect(x, y, TILE, TILE);
    // Pattern
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x+2, y+2, TILE-4, TILE-4);
  }
}

function drawPlates() {
  for (const p of plates) {
    const x = p.col * TILE, y = p.row * TILE;
    const col = p.channel === 'A' ? COL_PLATE_A : COL_PLATE_B;
    ctx.fillStyle = p.pressed ? col : '#4b5563';
    ctx.fillRect(x, y+TILE-3, TILE, 3);
    if (p.pressed) {
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.3;
      ctx.fillRect(x-1, y, TILE+2, TILE);
      ctx.globalAlpha = 1;
    }
  }
}

function drawExit() {
  if (!exitPortal) return;
  const x = exitPortal.col * TILE, y = exitPortal.row * TILE;
  const ph = (frameCount * 0.04) % 1;
  const r  = 2 + Math.sin(ph * Math.PI * 2) * 1;
  ctx.fillStyle = COL_EXIT;
  ctx.globalAlpha = 0.7 + Math.sin(ph * Math.PI * 2) * 0.3;
  ctx.beginPath();
  ctx.arc(x + TILE/2, y + TILE/2, r + 2, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x + TILE/2, y + TILE/2, r, 0, Math.PI*2);
  ctx.fill();
}

function drawPlayer() {
  if (!player || !player.alive) return;
  const x = Math.round(player.px - player.hw);
  const y = Math.round(player.py - player.hh*2);
  const w = player.hw * 2;
  const h = player.hh * 2;

  // Body
  ctx.fillStyle = COL_PLAYER;
  ctx.fillRect(x, y, w, h);

  // Eyes
  ctx.fillStyle = '#0d0b1a';
  if (player.facing === 1) {
    ctx.fillRect(x+w-3, y+1, 2, 2);
  } else {
    ctx.fillRect(x+1, y+1, 2, 2);
  }

  // Run animation legs
  if (player.anim === 'run') {
    const leg = Math.sin(frameCount * 0.3) > 0 ? 1 : -1;
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(x+1, y+h, 2, 2+leg);
    ctx.fillRect(x+w-3, y+h, 2, 2-leg);
  } else {
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(x+1, y+h, 2, 2);
    ctx.fillRect(x+w-3, y+h, 2, 2);
  }
}

function drawEcho() {
  if (!echo || !echo.active) return;
  const x = Math.round(echo.px - 3);
  const y = Math.round(echo.py - 10);

  // Scanline glitch effect
  const glitch = Math.random() < 0.05 ? (Math.random()-0.5)*3 : 0;

  // Cyan shadow body
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#0e7490';
  ctx.fillRect(x+1+glitch, y+1, 6, 10);
  ctx.globalAlpha = 1;

  // Outline
  ctx.strokeStyle = COL_ECHO;
  ctx.lineWidth   = 1;
  ctx.strokeRect(x+glitch+0.5, y+0.5, 6, 10);

  // Scanlines on echo
  ctx.fillStyle = COL_ECHO;
  ctx.globalAlpha = 0.15;
  for (let sy = y; sy < y+10; sy += 2) {
    ctx.fillRect(x+glitch, sy, 6, 1);
  }
  ctx.globalAlpha = 1;

  // Echo eyes
  ctx.fillStyle = COL_ECHO;
  ctx.globalAlpha = 0.8;
  if (echo.facing === 1) {
    ctx.fillRect(x+4+glitch, y+1, 2, 2);
  } else {
    ctx.fillRect(x+glitch, y+1, 2, 2);
  }
  ctx.globalAlpha = 1;
}

function drawFlyers() {
  for (const f of flyers) {
    if (!f.alive) continue;
    const x = Math.round(f.px - f.hw);
    const y = Math.round(f.py - f.hh);
    // Body
    ctx.fillStyle = COL_FLYER;
    ctx.fillRect(x, y, f.hw*2, f.hh*2);
    // Cat ears
    ctx.fillRect(x, y-2, 3, 2);
    ctx.fillRect(x+f.hw*2-3, y-2, 3, 2);
    // Eyes
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(x+1, y+2, 2, 2);
    ctx.fillRect(x+f.hw*2-3, y+2, 2, 2);
    // Wing flap
    const flap = Math.sin(frameCount * 0.4) > 0;
    ctx.fillStyle = '#fed7aa';
    if (flap) {
      ctx.fillRect(x-3, y+1, 3, 3);
      ctx.fillRect(x+f.hw*2, y+1, 3, 3);
    } else {
      ctx.fillRect(x-2, y+3, 2, 2);
      ctx.fillRect(x+f.hw*2, y+3, 2, 2);
    }
  }
}

function drawScreenFX() {
  // Vignette
  const vgr = ctx.createRadialGradient(CANVAS_W/2, CANVAS_H/2, CANVAS_H*0.3, CANVAS_W/2, CANVAS_H/2, CANVAS_H*0.8);
  vgr.addColorStop(0, 'rgba(0,0,0,0)');
  vgr.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vgr;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let y = 0; y < CANVAS_H; y += 2) {
    ctx.fillRect(0, y, CANVAS_W, 1);
  }

  // Death flash
  if (deathFlash > 0) {
    ctx.fillStyle = `rgba(244,114,182,${deathFlash * 0.4})`;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    deathFlash -= 0.08;
  }

  // Glitch effect
  if (glitchTimer > 0) {
    if (Math.random() < 0.4) {
      const sliceH = 2 + Math.floor(Math.random() * 8);
      const sliceY = Math.floor(Math.random() * CANVAS_H);
      const shift  = (Math.random() - 0.5) * 10;
      ctx.save();
      const imgData = ctx.getImageData(0, sliceY, CANVAS_W, sliceH);
      ctx.putImageData(imgData, shift, sliceY);
      ctx.restore();
    }
    glitchTimer -= 1/60;
  }
}

function drawHUD() {
  const lvl = LEVELS[levelIdx];
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, CANVAS_W, 14);

  ctx.fillStyle = '#e2e8f0';
  ctx.font      = '5px monospace';
  ctx.textBaseline = 'top';
  ctx.fillText(lvl.id.toUpperCase() + ': ' + lvl.title, 3, 3);
  ctx.fillText('ATT: ' + attempts, CANVAS_W - 45, 3);

  // Echo progress bar
  if (echo && echo.active) {
    const progress = echo.frame / echo.frames.length;
    ctx.fillStyle = '#1e3a3a';
    ctx.fillRect(CANVAS_W/2 - 30, 2, 60, 4);
    ctx.fillStyle = COL_ECHO;
    ctx.fillRect(CANVAS_W/2 - 30, 2, 60 * progress, 4);
    ctx.strokeStyle = COL_ECHO;
    ctx.lineWidth = 0.5;
    ctx.strokeRect(CANVAS_W/2 - 30, 2, 60, 4);
    // Label
    ctx.fillStyle = COL_ECHO;
    ctx.font = '4px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ECHO', CANVAS_W/2, 8);
    ctx.textAlign = 'left';
  }

  // R key hint
  ctx.fillStyle = 'rgba(100,116,139,0.6)';
  ctx.font = '4px monospace';
  ctx.fillText('R: REBOUND', 3, CANVAS_H - 7);
  ctx.fillText('ESC: PAUSE', CANVAS_W - 48, CANVAS_H - 7);
}

function drawHints() {
  if (!LEVELS[levelIdx]) return;
  const hints = LEVELS[levelIdx].hints;
  ctx.font = '4px monospace';
  ctx.textAlign = 'center';

  for (const h of hints) {
    const wx = h.cx * TILE - camX;
    const wy = h.cy * TILE - camY;
    if (wx < -50 || wx > CANVAS_W + 50) continue;
    if (wy < -20 || wy > CANVAS_H + 20) continue;

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    const tw = ctx.measureText(h.text).width;
    ctx.fillRect(wx - tw/2 - 2, wy - 2, tw + 4, 7);

    ctx.fillStyle = '#94a3b8';
    ctx.fillText(h.text, wx, wy);
  }
  ctx.textAlign = 'left';
}

function drawFailMsg() {
  if (failAlpha <= 0) return;
  const alpha = Math.min(1, failAlpha);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = COL_FAIL;
  ctx.fillText(failMsg, CANVAS_W/2 + (Math.random()<0.1?(Math.random()-0.5)*4:0), CANVAS_H/2);
  ctx.font = '5px monospace';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('PRESS R TO REBOUND MANUALLY', CANVAS_W/2, CANVAS_H/2 + 12);
  ctx.restore();
  failAlpha -= 0.015;
}

function drawMenu() {

  ctx.fillText('RE:BOUND', CANVAS_W/2 + gx, 60);

  vgr.addColorStop(1, 'rgba(0,0,0,0.6)');

function drawQuit() {
  ctx.fillStyle = '#080811';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  for (let y = 0; y < CANVAS_H; y += 2) ctx.fillRect(0, y, CANVAS_W, 1);

  // Header
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f43f5e';
  ctx.font = 'bold 13px monospace';
  ctx.fillText('QUIT GAME', CANVAS_W/2, 28);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '5px monospace';
  ctx.fillText('ARE YOU SURE YOU WANT TO QUIT?', CANVAS_W/2, 38);

  // Hamster meme on quit screen
  if (hamsterReady) {
    const iw = 100, ih = 90;
    const ix = CANVAS_W/2 - iw/2;
    const iy = 46;

    // Card frame
    ctx.fillStyle = '#1e1b2e';
    ctx.fillRect(ix - 4, iy - 4, iw + 8, ih + 8);
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 1;
    ctx.strokeRect(ix - 4, iy - 4, iw + 8, ih + 8);

    ctx.drawImage(hamsterImg, ix, iy, iw, ih);

    // Caption
    ctx.fillStyle = '#facc15';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('RAGEQUIT? GG!', CANVAS_W/2, iy + ih + 13);
  }

  ctx.font = '6px monospace';
  ctx.fillStyle = '#38bdf8';
  ctx.fillText('[SPACE] NEVER GIVE UP! RESUME', CANVAS_W/2, CANVAS_H - 22);
  ctx.fillStyle = '#f87171';
  ctx.fillText('[Q] / [ESC] CONFIRM QUIT & CLOSE', CANVAS_W/2, CANVAS_H - 10);
  ctx.textAlign = 'left';
}

function drawEnd() {
  ctx.fillStyle = COL_BG;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  for (let y = 0; y < CANVAS_H; y += 2) ctx.fillRect(0, y, CANVAS_W, 1);

  ctx.textAlign = 'center';
  ctx.fillStyle = COL_EXIT;
  ctx.font = '16px monospace';
  ctx.fillText('YOU DID IT.', CANVAS_W/2, 55);

  ctx.fillStyle = COL_ECHO;
  ctx.font = '7px monospace';
  ctx.fillText('ALL 7 LEVELS CLEARED', CANVAS_W/2, 78);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '5px monospace';
  ctx.fillText('total attempts: ' + totalAttempts, CANVAS_W/2, 100);

  ctx.fillStyle = COL_PLAYER;
  ctx.font = '5px monospace';
  const msg = totalAttempts < 20 ? 'CARRY OMG' : totalAttempts < 50 ? 'NOT BAD THO' : totalAttempts < 100 ? 'GIT GUDDED' : 'CERTIFIED GRINDER';
  ctx.fillText(msg, CANVAS_W/2, 112);

  ctx.fillStyle = '#475569';
  ctx.font = '4px monospace';
  const blink = Math.sin(frameCount * 0.08) > 0;
  if (blink) ctx.fillText('PRESS SPACE TO PLAY AGAIN', CANVAS_W/2, 140);

  ctx.fillStyle = '#1e293b';
  ctx.font = '4px monospace';
  ctx.fillText('RE:BOUND  |  2024  |  FAIZEEN HOQUE', CANVAS_W/2, 162);
  ctx.fillText('REVERSE-ENGINEERED FOR EDUCATIONAL PURPOSES', CANVAS_W/2, 170);
  ctx.textAlign = 'left';

  const vgr = ctx.createRadialGradient(CANVAS_W/2, CANVAS_H/2, 40, CANVAS_W/2, CANVAS_H/2, 120);
  vgr.addColorStop(0, 'rgba(0,0,0,0)');
  vgr.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vgr;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
}

// ══════════════════════════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════════════════════════
let lastTime = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  frameCount++;

  // ── Menu ──
  if (STATE === 'menu') {
    drawMenu();
    if (pressed('Space') || pressed('Enter')) {
      STATE = 'play';
      levelIdx = 0;
      totalAttempts = 0;
      loadLevel(0);
    }
    if (pressed('KeyQ')) {
      previousState = 'menu';
      STATE = 'quit';
    }
    clearJust(); return;
  }

  // ── Pause ──
  if (STATE === 'pause') {
    drawGame();
    drawPause();
    if (pressed('Escape') || pressed('KeyP')) STATE = 'play';
    if (pressed('KeyM')) { STATE = 'menu'; }
    if (pressed('KeyQ')) { previousState = 'pause'; STATE = 'quit'; }
    clearJust(); return;
  }

  // ── Quit Screen ──
  if (STATE === 'quit') {
    drawQuit();
    if (pressed('Space')) {
      STATE = (previousState === 'pause') ? 'play' : 'menu';
    }
    if (pressed('Escape') || pressed('KeyQ')) {
      window.close();
      ctx.fillStyle = '#080811';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#facc15';
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('THANKS FOR PLAYING RE:BOUND!', CANVAS_W/2, CANVAS_H/2 - 10);
      ctx.fillStyle = '#94a3b8';
      ctx.font = '6px monospace';
      ctx.fillText('You can now safely close this window.', CANVAS_W/2, CANVAS_H/2 + 10);
    }
    clearJust(); return;
  }

  // ── End ──
  if (STATE === 'end') {
    drawEnd();
    if (pressed('Space') || pressed('Enter')) {
      STATE = 'menu';
    }
    clearJust(); return;
  }

  // ── Play ──
  // R key = rebound
  if (pressed('KeyR') && player && player.alive) rebound();
  // Pause
  if (pressed('Escape') || pressed('KeyP')) STATE = 'pause';

  // Reset plate echo-pressing flag
  for (const p of plates) p._echoPressing = false;

  updateEcho(dt);

  // After echo updates plates, mark them as echo-pressing so player check doesn't clear
  for (const p of plates) {
    if (p.pressed) p._echoPressing = true;
  }

  updatePlayer(dt);
  updateWaves(dt);
  updateFlyers(dt);
  updateCamera();

  // Fade fail alpha
  if (failAlpha > 0) failAlpha -= dt * 0.5;

  drawGame();
  clearJust();
}

// ══════════════════════════════════════════════════════
//  START
// ══════════════════════════════════════════════════════
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
</script>
